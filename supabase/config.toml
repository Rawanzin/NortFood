project_id = "nortfood"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "env(NORTFOOD_APP_URL)"
additional_redirect_urls = ["env(NORTFOOD_AUTH_REDIRECT_URL)"]
minimum_password_length = 8
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
[functions.upload-media]
verify_jwt = false

# Configuração local: o provedor remoto depende de remetente verificado.
[auth.email.template.confirmation]
subject = "Confirme seu cadastro no NortFood"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Recupere seu acesso ao NortFood"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.email_change]
subject = "Confirme a alteração de e-mail no NortFood"
content_path = "./supabase/templates/email_change.html"
