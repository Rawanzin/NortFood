[build]
command = "pnpm lint && pnpm test:release:unit && pnpm check:architecture && pnpm build && pnpm audit:release"
publish = "dist"
[build.environment]
NODE_VERSION = "24"
PNPM_VERSION = "11.25.0"
NORTFOOD_PUBLIC_PREVIEW = "no"
NORTFOOD_PUBLIC_ACCOUNTS = "yes"
NORTFOOD_ENABLE_INDEXING = "no"

[context.deploy-preview.environment]
NORTFOOD_ENABLE_INDEXING = "no"
NORTFOOD_GA4_MEASUREMENT_ID = ""

[context.branch-deploy.environment]
NORTFOOD_ENABLE_INDEXING = "no"
NORTFOOD_GA4_MEASUREMENT_ID = ""
# A producao usa somente release/nortfood; este commit verifica o webhook automatico.
